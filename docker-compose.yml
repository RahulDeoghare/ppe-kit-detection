services:
  postgres:
    image: postgres:15-alpine
    container_name: ppe_detection_db
    environment:
      POSTGRES_DB: ppe_detection
      POSTGRES_USER: ppe_user
      POSTGRES_PASSWORD: ppe_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/violations_only.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ppe_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppe_user -d ppe_detection"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ppe_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ppe.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ppe_network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ppe_network:
    driver: bridge